<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA3 Scene Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">GTA3 Viewer</span>
    <a href="index.html" class="navlink">Model Viewer</a>
    <a href="scene.html" class="navlink active">Scene Viewer</a>
    <a href="fullcity.html" class="navlink">Full City</a>
  </nav>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="title">DISTRICTS</span>
        <span id="model-count" class="count"></span>
      </div>

      <div class="sidebar-actions">
        <label class="speed-row">
          <span>Fly speed</span>
          <input type="range" id="fly-speed" min="0.25" max="4" step="0.25" value="1">
          <span id="fly-speed-val" class="speed-val">1×</span>
        </label>
      </div>

      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M11.7 10.3a5 5 0 1 0-1.4 1.4l3 3 1.4-1.4-3-3zM3 7a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/>
        </svg>
        <input type="search" id="search" placeholder="Search districts…"
               autocomplete="off" spellcheck="false">
        <button id="search-clear" class="search-clear" title="Clear" hidden>&times;</button>
      </div>

      <div id="tree" class="tree" tabindex="0">
        <div class="tree-message">Loading scene…</div>
      </div>
    </aside>

    <div id="resizer" role="separator" aria-orientation="vertical"></div>

    <main id="viewport">
      <header class="viewport-header">
        <span id="selected-name" class="selected-name">No scene loaded</span>
        <span id="selected-path" class="selected-path"></span>
        <span id="progress" class="progress"></span>
      </header>
      <div id="canvas-wrap">
        <canvas id="gl-canvas"></canvas>
        <div id="canvas-placeholder" class="canvas-placeholder">
          <div class="ph-glyph">🏙</div>
          <div class="ph-text">Pick a district on the left to view it</div>
        </div>
        <div class="controls-hint">
          drag or <b>click</b> to look around (<b>Esc</b> release) &nbsp;·&nbsp;
          <b>arrows</b>/<b>WASD</b> move &nbsp;·&nbsp; <b>Q</b>/<b>E</b> down/up
          &nbsp;·&nbsp; <b>Shift</b> sprint &nbsp;·&nbsp; scroll to dolly
        </div>
      </div>
    </main>
  </div>

  <script src="scene-renderer.js"></script>
  <script src="scene-app.js"></script>
</body>
</html>
